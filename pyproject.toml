[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-claim-audit"
version = "0.1.0"
description = "Static audit of documented pasteboard capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
clipboard-claim-audit = "clipboard_claim_audit:main"

[tool.setuptools.packages.find]
include = ["clipboard_claim_audit*"]
